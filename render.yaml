# Staging / UAT. Free Render services sleep when idle; NOT for payment production.
# Website lives on Cloudflare Pages; API custom subdomain: api.srcenterprises.in
services:
  - type: web
    name: src-enterprises-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGIN
        value: https://srcenterprises.in,https://www.srcenterprises.in
      - key: APP_PUBLIC_URL
        value: https://srcenterprises.in
      - key: SRC_PAYMENTS_ENABLED
        value: "false"
      - key: SRC_SCHEME_SUBSCRIPTIONS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SRC_JWT_SECRET
        sync: false
