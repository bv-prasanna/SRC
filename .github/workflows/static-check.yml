name: Static checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate storefront and compliance guards
        run: node scripts/check.mjs
      - name: Verify role interfaces and demo catalogue
        run: node scripts/check-roles.mjs
      - name: Verify safe Cloudflare Pages build and API mapping
        run: node scripts/check-deployment.mjs
