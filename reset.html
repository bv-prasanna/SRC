<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your SRC password</title><link rel="stylesheet" href="assets/storefront.css"></head><body><div class="wrap"><div class="panel auth-card"><img src="assets/src-enterprises-mark.svg" alt="SRC Enterprises" style="width:240px"><h2>Set a new password</h2><p class="muted">The reset link expires after 30 minutes and can be used once.</p><form id="reset"><div class="field"><label>New password<input type="password" name="password" minlength="12" autocomplete="new-password" required></label></div><button class="btn orange" type="submit">Update password</button></form><div id="result" class="feedback" role="status"></div><p style="margin-top:24px"><a href="index.html#account">Return to sign in</a></p></div></div><script src="config.js"></script><script>
const base=(window.SRC_API_BASE||((location.hostname==="localhost"||location.hostname==="127.0.0.1")&&location.port==="8000"?"http://localhost:8080":"")).replace(/\/$/,"");document.getElementById("reset").onsubmit=async e=>{e.preventDefault();const token=new URLSearchParams(location.search).get("token")||"";const password=new FormData(e.target).get("password");try{const r=await fetch(base+"/api/auth/password/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password})});const d=await r.json();document.getElementById("result").textContent=r.ok?d.message:(d.error||"Reset failed")}catch{document.getElementById("result").textContent="Reset service unavailable"}};</script></body></html>
