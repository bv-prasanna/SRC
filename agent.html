<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRC Agent Workspace</title><link rel="stylesheet" href="assets/storefront.css"></head><body><div class="topbar"><div class="wrap top-inner"><span>SRC ENTERPRISES · INTERNAL OPERATIONS</span><a href="index.html">← Back to storefront</a></div></div><div class="wrap section"><img src="assets/src-enterprises-mark.svg" alt="SRC Enterprises" style="max-width:280px;width:100%;height:90px"><div class="eyebrow">Role protected workspace</div><h1>Agent enquiries</h1><p class="muted">View only enquiries assigned to your account. Do not enter payment information here.</p>
<div class="panel" id="agentLogin"><h2>Agent sign in</h2><form id="login"><div class="field"><label>Email<input name="email" type="email" required></label></div><div class="field"><label>Password<input name="password" type="password" minlength="12" required></label></div><button class="btn">Sign in</button></form></div>
<div id="agentSpace" class="hide"><button class="btn light" id="refresh">Refresh assigned enquiries</button> <button class="btn light" id="logout">Sign out</button><div id="agentList" style="margin-top:24px"></div></div><p id="status" role="status" class="feedback"></p></div>
<script src="config.js"></script><script>
const apiBase=(window.SRC_API_BASE||((location.hostname==="localhost"||location.hostname==="127.0.0.1")&&location.port==="8000"?"http://localhost:8080":"")).replace(/\/$/,"");let token="";
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,options={}){const r=await fetch(apiBase+path,{...options,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})}});if(r.status===204)return {};const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function refresh(){try{const items=await api("/api/agent/enquiries");document.getElementById("agentList").innerHTML=items.length?items.map(e=>'<article class="panel"><h3>Enquiry #'+esc(e.id)+' · '+esc(e.section_slug)+'</h3><p><b>'+esc(e.customer_name)+'</b> &nbsp; '+esc(e.email)+' &nbsp; '+esc(e.phone)+'</p><p>Status: '+esc(e.status)+'</p><form data-id="'+Number(e.id)+'"><textarea name="note" rows="2" placeholder="Internal follow-up note" required minlength="2" maxlength="1000" style="width:100%;padding:11px;border:1px solid #ccd7e3;border-radius:8px"></textarea><p><button class="btn" type="submit">Save note</button></p></form></article>').join(""):'<div class="empty">No enquiries are assigned to you yet.</div>';document.querySelectorAll("form[data-id]").forEach(f=>f.onsubmit=async ev=>{ev.preventDefault();try{await api("/api/agent/enquiries/"+f.dataset.id+"/notes",{method:"POST",body:JSON.stringify({note:new FormData(f).get("note")})});f.reset();document.getElementById("status").textContent="Note saved"}catch(e){document.getElementById("status").textContent=e.message}})}catch(e){document.getElementById("status").textContent=e.message}}
document.getElementById("login").onsubmit=async ev=>{ev.preventDefault();try{const v=Object.fromEntries(new FormData(ev.target));const r=await api("/api/auth/login",{method:"POST",body:JSON.stringify(v)});if(!["AGENT","ADMIN"].includes(r.user?.role))throw Error("This account is not assigned an agent role");token=r.token;document.getElementById("agentLogin").classList.add("hide");document.getElementById("agentSpace").classList.remove("hide");await refresh()}catch(e){document.getElementById("status").textContent=e.message}};
document.getElementById("refresh").onclick=refresh;document.getElementById("logout").onclick=async()=>{await api("/api/auth/logout",{method:"POST"}).catch(()=>{});location.reload()};
</script></body></html>
