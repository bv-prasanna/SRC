server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/srcdev;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  h2:
    console:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
src:
  admin:
    username: ${SRC_ADMIN_USERNAME:}
    password: ${SRC_ADMIN_PASSWORD:}
  cors:
    origin: ${SRC_CORS_ORIGIN:https://srcenterprises.in}
